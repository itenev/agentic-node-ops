[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-node-ops"
version = "0.1.0"
description = "Ethereum validator node monitoring powered by Hermes Agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
    "pip-audit>=2.7",
]

[tool.ruff.lint]
# Explicit rule gate: the repo's lint standard. Ruff >=0.17 expanded its
# default rule set (I/UP/PLW/ASYNC/BLE...) which this codebase was never
# written against — pinning keeps CI enforcing what it always enforced.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Formatter for Python only. Ruff >=0.17 also formats Python code blocks
# embedded in Markdown docs; the docs' snippets predate that and CI's
# `ruff format --check .` fails on them. Keep the formatter off prose.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "webhook-receiver/tests"]
asyncio_mode = "auto"
pythonpath = ["src", "webhook-receiver/src"]

[tool.setuptools.packages.find]
where = ["src"]
