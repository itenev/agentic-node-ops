# Alertmanager Routing Configuration for Hermes
#
# Add this to your eth-docker Alertmanager configuration (e.g., alertmanager/config.yml)
# to route all alerts to the Hermes webhook receiver for normalization and reasoning.

route:
  # Default receiver for all alerts
  receiver: 'hermes-webhook'
  
  # Optional: Group alerts to reduce notification spam
  # Note: eth-docker uses 'instance' or 'job' labels, not 'host'
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'hermes-webhook'
    webhook_configs:
      # Adjust the URL if webhook-receiver is deployed on a different host/port
      - url: 'http://webhook-receiver:8090/webhook'
        send_resolved: true
        # Shared-secret auth: must match WEBHOOK_AUTH_TOKEN in the receiver's env.
        # Generate with: openssl rand -hex 32
        # Alertmanager 0.27+ schema: http_headers live under http_config and
        # each value must be a mapping (values/secrets/files). `secrets` stay
        # hidden in the Alertmanager UI.
        http_config:
          http_headers:
            X-Hermes-Token:
              secrets: ['<WEBHOOK_AUTH_TOKEN value>']

# Global settings (ensure these match your existing Alertmanager config)
global:
  resolve_timeout: 5m